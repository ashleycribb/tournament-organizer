<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Assistant</title>
    <link rel="stylesheet" href="assets/style.css">
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #chat-window {
            width: 80%;
            height: 400px;
            border: 1px solid #ccc;
            overflow-y: scroll;
            padding: 10px;
            margin-bottom: 10px;
        }

        #command-input {
            width: 80%;
            padding: 10px;
        }
    </style>
</head>
<body>
    <h1>AI Assistant</h1>
    <div id="chat-window"></div>
    <input type="text" id="command-input" placeholder="Enter a command...">

    <script type="module">
        import TournamentOrganizer from '../dist/index.module.js';
        import { AIAssistant } from '../dist/components/AIAssistant.js';

        const chatWindow = document.getElementById('chat-window');
        const commandInput = document.getElementById('command-input');

        const manager = new TournamentOrganizer();
        const tournament = manager.createTournament('My Tournament');
        const aiAssistant = new AIAssistant(tournament);

        commandInput.addEventListener('keydown', async (event) => {
            if (event.key === 'Enter') {
                const command = commandInput.value;
                commandInput.value = '';

                const userMessage = document.createElement('p');
                userMessage.textContent = `You: ${command}`;
                chatWindow.appendChild(userMessage);

                const response = await aiAssistant.processCommand(command);

                const aiMessage = document.createElement('p');
                aiMessage.textContent = `AI: ${response}`;
                chatWindow.appendChild(aiMessage);

                chatWindow.scrollTop = chatWindow.scrollHeight;
            }
        });
    </script>
</body>
</html>
